<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
    color: white;
    text-align: center;
}

/* Аватар */
.avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    margin-top: 40px;
    margin-bottom: 20px;
    border: 3px solid white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* Контейнер */
.container {
    max-width: 400px;
    margin: auto;
    padding: 20px;
}

/* Заголовок */
h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

/* Текст */
p {
    opacity: 0.7;
    margin-bottom: 20px;
}

/* Кнопки */
.btn {
    display: block;
    background: white;
    color: black;
    text-decoration: none;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    transition: 0.3s;
}

.btn:hover {
    background: #ddd;
}
</style>
</head>

<body>

<img src="avatar.png" class="avatar" alt="Мой аватар">

<div class="container">
    <h1>Максим</h1>
    <p>Мой портфолио сайт</p>

    <a href="#" class="btn">Мои проекты</a>
    <a href="#" class="btn">Контакты</a>
</div>

</body>
</html>
